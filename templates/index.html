<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quick Calendar AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 12px 60px 12px;
      color: #0f172a;
      background: #f1f5f9;
      -webkit-text-size-adjust: 100%;
    }
    .card {
      background: #ffffff;
      padding: 18px 16px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    h2 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; }
    p.subtitle { color: #64748b; font-size: 13px; margin: 0 0 16px 0; line-height: 1.4; }

    /* Auto-wrapping multi-line prompt */
    #promptInput {
      width: 100%;
      min-height: 85px;
      padding: 12px;
      font-size: 16px; /* Prevents auto-zoom on iOS */
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      resize: vertical;
      font-family: inherit;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.4;
    }
    #promptInput:focus, input:focus, textarea:focus, select:focus {
      border-color: #2563eb;
      outline: none;
    }

    /* Live Countdown / Typing Indicator Badge & Error Status Row */
    .status-container {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      min-height: 24px;
      font-size: 13px;
    }
    .badge {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 12px;
    }
    .badge.countdown { display: inline-flex; background: #fef3c7; color: #b45309; }
    .badge.processing { display: inline-flex; background: #ede9fe; color: #6d28d9; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-text { color: #64748b; font-size: 12px; }

    /* Inline Retry Button */
    .retry-btn {
      display: none;
      align-items: center;
      gap: 4px;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1;
      transition: all 0.15s ease;
    }
    .retry-btn:hover {
      background: #e2e8f0;
      color: #1e293b;
    }
    .retry-btn:active {
      transform: scale(0.96);
    }

    /* Mobile-Optimized Event Cards */
    #editContainer { display: none; margin-top: 18px; padding-top: 16px; border-top: 1px solid #e2e8f0; }
    
    .event-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .event-count { font-size: 13px; font-weight: 700; color: #2563eb; }
    .remove-btn {
      background: #fee2e2;
      border: none;
      color: #ef4444;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .field-group { margin-bottom: 10px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .auto-grow-input {
      width: 100%;
      min-height: 44px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-family: inherit;
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.35;
      overflow: hidden;
    }

    select.input-type, input[type="datetime-local"] {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
    }

    .grid-dates {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 480px) {
      .grid-dates { grid-template-columns: 1fr 1fr; }
    }

    .submit-btn {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin-top: 8px;
    }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }

    .success-banner {
      margin-top: 16px;
      padding: 14px;
      background: #ecfdf5;
      border-left: 4px solid #10b981;
      border-radius: 8px;
      display: none;
    }
    .success-banner ul { margin: 8px 0 0 16px; padding: 0; font-size: 14px; line-height: 1.6; }
    .success-banner a { color: #059669; font-weight: 600; text-decoration: none; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Smart Calendar Scheduler</h2>
    <p class="subtitle">Type your plans naturally. Details will auto-extract below for quick edits before saving.</p>
    
    <textarea id="promptInput" placeholder="e.g., gym tomorrow from 12-2, dentist appointment at 3pm on Tuesday, buy groceries by 6pm"></textarea>
    
    <div class="status-container">
      <span id="indicatorBadge" class="badge">
        <span class="dot"></span>
        <span id="badgeText"></span>
      </span>
      <span id="statusText" class="status-text"></span>
      <button type="button" id="retryBtn" class="retry-btn">↺ Retry</button>
    </div>

    <form id="editContainer">
      <div id="cardsList"></div>
      <button type="submit" id="confirmBtn" class="submit-btn">Confirm & Add to Calendar</button>
    </form>

    <div id="successCard" class="success-banner">
      <strong>Scheduled Successfully!</strong>
      <ul id="createdEventsList"></ul>
    </div>
  </div>

  <script>
    let countdownInterval;
    let secondsLeft = 3;

    const promptInput = document.getElementById('promptInput');
    const indicatorBadge = document.getElementById('indicatorBadge');
    const badgeText = document.getElementById('badgeText');
    const statusText = document.getElementById('statusText');
    const retryBtn = document.getElementById('retryBtn');
    const editContainer = document.getElementById('editContainer');
    const cardsList = document.getElementById('cardsList');
    const confirmBtn = document.getElementById('confirmBtn');
    const successCard = document.getElementById('successCard');
    const createdEventsList = document.getElementById('createdEventsList');

    function updateBadge(state, text, message = '', showRetry = false) {
      indicatorBadge.className = 'badge ' + state;
      indicatorBadge.style.display = state ? 'inline-flex' : 'none';
      badgeText.innerText = text;
      statusText.innerText = message;
      retryBtn.style.display = showRetry ? 'inline-flex' : 'none';
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = (textarea.scrollHeight) + 'px';
    }

    function createCardElement(item, index) {
      const card = document.createElement('div');
      card.className = 'event-item';
      const type = item.entry_type || 'event';

      card.innerHTML = `
        <div class="event-header">
          <span class="event-count">Item #${index + 1}</span>
          <button type="button" class="remove-btn" onclick="this.closest('.event-item').remove()">Remove</button>
        </div>
        
        <div class="grid-dates" style="margin-bottom: 10px;">
          <div class="field-group">
            <label>Type</label>
            <select class="input-type">
              <option value="event" ${type === 'event' ? 'selected' : ''}>📅 Event</option>
              <option value="appointment" ${type === 'appointment' ? 'selected' : ''}>📍 Appointment</option>
              <option value="task" ${type === 'task' ? 'selected' : ''}>✅ Task</option>
            </select>
          </div>
          <div class="field-group">
            <label>Title</label>
            <textarea class="auto-grow-input input-summary" rows="1" required>${item.summary || ''}</textarea>
          </div>
        </div>

        <div class="grid-dates">
          <div class="field-group">
            <label>Start Time</label>
            <input type="datetime-local" class="input-start" value="${(item.start_iso || '').slice(0, 16)}" required />
          </div>
          <div class="field-group">
            <label>End Time</label>
            <input type="datetime-local" class="input-end" value="${(item.end_iso || '').slice(0, 16)}" required />
          </div>
        </div>

        <div class="field-group" style="margin-top: 10px;">
          <label>Notes / Description</label>
          <textarea class="auto-grow-input input-desc" rows="1" placeholder="Optional details">${item.description || ''}</textarea>
        </div>
      `;

      const textareas = card.querySelectorAll('.auto-grow-input');
      textareas.forEach(ta => {
        ta.addEventListener('input', () => autoResize(ta));
        setTimeout(() => autoResize(ta), 0);
      });

      return card;
    }

    async function triggerParse(val) {
      updateBadge('processing', 'AI Extracting...', 'Parsing with Gemini', false);

      try {
        const res = await fetch('/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: val,
            timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            clientNow: new Date().toISOString()
          })
        });

        const contentType = res.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          updateBadge('', '', 'Session expired. Please refresh the page.', false);
          return;
        }

        const data = await res.json();
        if (res.ok && data.events && data.events.length > 0) {
          cardsList.innerHTML = '';
          data.events.forEach((item, idx) => {
            cardsList.appendChild(createCardElement(item, idx));
          });

          updateBadge('', '', `Parsed ${data.events.length} item(s). Edit & confirm:`, false);
          confirmBtn.innerText = data.events.length > 1 ? `Confirm & Add ${data.events.length} Items` : 'Confirm & Add to Calendar';
          editContainer.style.display = 'block';
        } else {
          updateBadge('', '', data.error || 'Failed to extract items.', true);
        }
      } catch (err) {
        updateBadge('', '', 'Connection failed.', true);
      }
    }

    // Manual retry click handler
    retryBtn.addEventListener('click', () => {
      const val = promptInput.value.trim();
      if (val) {
        triggerParse(val);
      }
    });

    promptInput.addEventListener('input', () => {
      clearInterval(countdownInterval);
      successCard.style.display = 'none';

      const val = promptInput.value.trim();
      if (!val) {
        updateBadge('', '', '', false);
        editContainer.style.display = 'none';
        cardsList.innerHTML = '';
        return;
      }

      secondsLeft = 3;
      updateBadge('countdown', `Processing in ${secondsLeft}s`, 'Keep typing or pause to extract', false);

      countdownInterval = setInterval(async () => {
        secondsLeft--;
        if (secondsLeft > 0) {
          updateBadge('countdown', `Processing in ${secondsLeft}s`, 'Keep typing or pause to extract', false);
        } else {
          clearInterval(countdownInterval);
          triggerParse(val);
        }
      }, 1000);
    });

    editContainer.addEventListener('submit', async (e) => {
      e.preventDefault();

      const cards = cardsList.querySelectorAll('.event-item');
      if (cards.length === 0) {
        alert('No events to schedule.');
        return;
      }

      const eventsToSubmit = [];
      for (const card of cards) {
        const summary = card.querySelector('.input-summary').value.trim();
        const entry_type = card.querySelector('.input-type').value;
        const start_iso = card.querySelector('.input-start').value;
        const end_iso = card.querySelector('.input-end').value;
        const description = card.querySelector('.input-desc').value.trim();

        if (!summary || !start_iso || !end_iso) {
          alert('Please fill out the Title, Start Time, and End Time for all items.');
          return;
        }

        eventsToSubmit.push({ summary, entry_type, start_iso, end_iso, description });
      }

      confirmBtn.disabled = true;
      confirmBtn.innerText = 'Adding to Calendar...';

      try {
        const res = await fetch('/schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            events: eventsToSubmit,
            timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
          })
        });

        const contentType = res.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          alert("Server error or session expired. Please refresh the page.");
          return;
        }

        const data = await res.json();
        if (res.ok) {
          createdEventsList.innerHTML = '';
          data.events.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="${item.link}" target="_blank">${item.summary} &rarr;</a>`;
            createdEventsList.appendChild(li);
          });

          successCard.style.display = 'block';
          promptInput.value = '';
          cardsList.innerHTML = '';
          editContainer.style.display = 'none';
          updateBadge('', '', '', false);
        } else {
          alert(data.error || 'Could not save events.');
        }
      } catch (err) {
        alert('Request failed: ' + err.message);
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.innerText = 'Confirm & Add to Calendar';
      }
    });
  </script>
</body>
</html>
